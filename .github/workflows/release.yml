name: Build & Release (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-macos-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            platform: macos-intel
            bundles: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust security & crypto tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle (${{ matrix.platform }})
        run: pnpm run tauri build --bundles ${{ matrix.bundles }}

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p upload
          if [ "${{ runner.os }}" = "Linux" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} upload/ \;
          else
            find src-tauri/target/release/bundle -type f -name "*.dmg" -exec cp {} upload/ \;
          fi
          ls -la upload

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" upload/* --clobber --repo "${{ github.repository }}"

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Repose Setup.exe
        shell: pwsh
        run: .\scripts\build-setup.ps1

      - name: Upload Windows Setup to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          gh release upload $tag dist-release/Repose-Setup-*.exe dist-release/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
