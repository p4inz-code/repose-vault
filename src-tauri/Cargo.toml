[package]
name = "repose"
version = "1.0.0"
description = "Repose - Airgapped Personal Space Vault"
authors = ["Atharva Patil <dev@p4inz.com>"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "repose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Audited RustCrypto Cryptographic Primitives
argon2 = { version = "0.5", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
rand_core = { version = "0.6", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
hex = "0.4"
dirs = "6.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
panic = "abort"
strip = true
